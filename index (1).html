<style>
  :root{--ink:#1d2735;--paper:#fbf8f1;--card:#fff;--navy:#24344e;--gold:#b9904f;--line:#e5ddd0;--muted:#6b7280;--chip:#f2ead9}
  *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.75}
  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 48px}
  header{padding:20px 4px 6px} .kicker{color:var(--gold);font-weight:700;letter-spacing:.12em;font-size:12px}
  h1{font-family:serif;font-size:29px;line-height:1.35;margin:6px 0 4px;color:var(--navy)} .sub{color:var(--muted);font-size:14px}
  .stats{position:sticky;top:0;background:rgba(251,248,241,.97);backdrop-filter:blur(6px);padding:10px 0;z-index:5;border-bottom:1px solid var(--line)}

  .scene-title{font-family:serif;font-size:23px;color:var(--navy);margin:4px 0 10px}
  .text{white-space:pre-wrap;font-size:16px}
  .doc{background:#f7f2e7;border-left:4px solid var(--gold);padding:12px 14px;border-radius:10px;margin:14px 0;font-size:14px;white-space:pre-wrap}
  .result{background:#f7f2e7;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:14px;white-space:pre-wrap}
  .notebox{background:#eef2f7;border:1px solid #cfd9e5;border-radius:14px;padding:15px 16px;margin-top:16px}
  .notebox .ntitle{font-weight:800;color:var(--navy);margin-bottom:6px}.notebox .nbody{font-size:14px;white-space:pre-wrap}
  .choices{display:grid;gap:10px;margin-top:20px}

  button.choice small{display:block;font-weight:400;color:var(--muted);margin-top:3px}
  .note{font-size:13px;color:var(--muted);margin-top:14px}

  table{width:100%;border-collapse:collapse;font-size:14px;margin:12px 0} th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left} td:last-child,th:last-child{text-align:right;white-space:nowrap}

  .review{border-top:1px solid var(--line);padding:10px 2px}.review b{color:var(--navy)} .review .rv{font-size:14px;color:#374151}
  .know{background:#f7f2e7;border-radius:12px;padding:12px 16px;font-size:14px}.know li{margin:7px 0}
  .qual{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.qchip{background:var(--chip);border:1px solid var(--line);padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700}
  .casecard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 6px 20px rgba(40,35,20,.05);cursor:pointer}
  .casecard:active{transform:scale(.995)}
  .cc-top{display:flex;gap:12px;align-items:flex-start}.cc-icon{font-size:32px;line-height:1.2}
  .cc-title{font-family:serif;font-size:20px;color:var(--navy);font-weight:700}
  .cc-meta{font-size:13px;color:var(--muted)}
  .cc-status{margin-left:auto;text-align:right;font-size:12px;font-weight:800;color:var(--gold);white-space:nowrap}
  .cc-desc{font-size:14px;margin-top:8px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .fbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
  .fbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .toolbar{display:flex;gap:10px;margin-top:16px}.toolbar button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:700;color:var(--muted);cursor:pointer}
  footer{color:var(--muted);font-size:12px;margin-top:22px;text-align:center}

<body>
<div class="wrap">
  <header>
    <div class="kicker">MY COURT STORIES ／ 自分用</div>
    <h1>⚖️ 法廷トラブル・ポケット</h1>
    <div class="sub">身近なトラブルを、発端から判決まで選択で追う小さな法廷ゲーム集</div>
  </header>
  <div class="stats" id="topbar"></div>
  <main id="app"></main>
  <footer>※ 収録事件はすべてフィクションです。金額計算や手続は学習用に簡略化しており、実際の法律相談・法的判断の代わりにはなりません。</footer>
</div>

<script>
/* ============ 共通ノート ============ */
const NOTES = {
  record:{title:'📘 要所ノート ― 「記録に残る形」で伝える', body:`口頭のやり取りは早くて温度感も伝わりますが、あとで「言った／言っていない」になると弱くなります。メールや書面は、内容と日付がそのまま証拠になります。大事な交渉ほど、手段そのものがメッセージになります。`},
  proof:{title:'📘 要所ノート ― 主張と証拠の「対応」', body:`裁判官が読むのは資料の量ではなく、「この主張は、この証拠で裏付けられている」という対応関係です。資料を全部出すと一見強そうですが、対応が分からない山は説得力を上げません。時系列で並べる、対応表を作る――地味な整理がそのまま説得力になります。`},
  credibility:{title:'📘 要所ノート ― 供述の信用性', body:`裁判官の質問は知識を試す場ではなく、心証を作る場です。言えることと推測を分けて答える人は、他の部分も信用されやすくなります。裏付けの薄い断言が一つ崩れると、主張全体の信用が揺らぐことがあります。`},
  negotiation:{title:'📘 要所ノート ― 交渉と和解の設計', body:`最初の提示額は、その後の話し合いの物差し（アンカー）になります。一部を認める譲歩は話を進めますが、認めた部分は戻ってきにくくなります。和解は「確実さ」と「金額」の交換で、判決は上振れも下振れもあり、時間もかかります。`},
  procedure:{title:'📘 要所ノート ― 手続の選び方', body:`少額訴訟は60万円以下の金銭請求で使え、原則1回の審理で判決まで行きます（相手が望めば通常訴訟に移ることがあります）。通常訴訟はじっくり争える分、時間がかかります。民事調停は話し合いで、合意できなければ決着はつきません。`}
};

/* 条件で効果が変わる選択肢用の関数 */
const FXFN = {
  wallRule: s => ({cl: s.flags.guideline ? 2 : 1}),
  wallPhoto: s => (s.flags.opponentPhoto ? {ev:2, cl:1} : {cl:1}),
  floorPhoto: s => (s.flags.photo ? {tr:2, ev:1} : {tr:-1}),
  dashcam: s => (s.flags.dashcam ? {ev:2, cl:1} : {ev:1}),
  timesheet: s => (s.flags.logData ? {ev:2, cl:1} : {cl:1})
};

const CASES = [];
/* ============ 事件1：敷金 ============ */
CASES.push({
  id:'shikikin', icon:'🏠', title:'返ってこない敷金', cat:'不動産', claim:160000, claimLabel:'敷金返還請求 160,000円', time:'約12分',
  desc:'退去したら敷金がほぼ全額差し引かれ、追加請求まで来た。壁紙・床・クリーニングの負担をめぐる争い。',
  notes:{ rule:{title:'📘 要所ノート ― 原状回復のルール', body:`民法621条は賃借人の原状回復義務を定めつつ、通常損耗や経年変化は対象から除いています。国土交通省の原状回復ガイドラインは法律そのものではありませんが、実務や裁判で広く参照されます。特約があっても、合意の内容や説明の仕方によって負担範囲は争い得ます。`},
    evidence:{title:'📘 要所ノート ― 証拠は「入居時」と「退去時」の比較', body:`争いになるのは「その傷や汚れは、いつ付いたのか」です。効くのは退去時の写真だけではなく、入居時の状態との“対”です。写真の日付、部屋全体と傷の近景のセットが効いてきます。相手が持つ立会い写真も、こちらに有利に働くことがあります。`} },
  knowledge:[
    '<b>写真は「入居時と退去時の対」で残す。</b>日付が分かる形で、全体と傷の近景をセットで。',
    '<b>原状回復のルールは民法621条。</b>通常損耗・経年変化は原則として借主負担ではない。',
    '<b>敷金の返還は民法622条の2。</b>控除する側に、その根拠が問われる。',
    '<b>特約があっても無制限ではない。</b>合意の内容や説明によって争える余地がある。',
    '<b>少額訴訟は60万円以下の金銭請求の選択肢。</b>速さと引き換えの割り切りもある。'],
  endings:{
    settle70:{title:'交渉で和解（70,000円）', amount:70000, body:'裁判をせず70,000円の返還で終了。時間と手間は最小限だが、準備を積んだ分だけ高い和解もあり得たかもしれない。'},
    settle90:{title:'交渉で和解（90,000円）', amount:90000, body:'逆提案で当初の提示から20,000円上がった90,000円で和解。準備の成果が金額に表れた形。'},
    judgeSettle:{title:'裁判上の和解（110,000円）', amount:110000, body:'裁判官の和解案を受け入れ110,000円で終了。確実さと引き換えに、判決での上振れは置いていった。'}},
  verdict:{mode:'deduction', base:160000, items:[
    {label:'壁紙張替え', claimed:78000, stat:'evcl', hi:10, lo:7, amounts:[0,30000,60000], why:'経年変化の主張と状態の証拠が揃うほど、借主負担は認められにくくなった。'},
    {label:'フローリング修理', claimed:42000, stat:'tr', hi:3, lo:1, amounts:[10000,25000,42000], why:'裁判官の質問への答え方と写真の裏付けが心証を分けた。'},
    {label:'ハウスクリーニング', claimed:55000, stat:'cl', hi:99, lo:98, flagGood:'contract', flagMid:'demandPartial', amounts:[20000,30000,55000], why:'特約を確認していたか、交渉で一部を認めていたかが影響した。'}]},
  scenes:{
    intro:{phase:'発端', title:'精算書が届いた', text:`4年間住んだ1LDKを退去して1か月。管理会社から敷金の精算書が届きました。`, doc:`【敷金精算書】\n預かり敷金 160,000円\nハウスクリーニング 55,000円\n壁紙張替え 78,000円\nフローリング修理 42,000円\n差引 ▲15,000円（追加でお支払いください）`, choices:[{label:'精算の中身を、順番に確かめていく', next:'s2'}]},
    s2:{phase:'交渉のはじめ', title:'最初の連絡をどう取るか', text:`壁紙は日焼けだと思っていたし、床の小さい傷も入居前からあった気がする。まず管理会社への連絡方法を決めます。`, noteKey:'record', choices:[
      {label:'電話で担当者に直接聞く', small:'早い。手持ち資料の有無もその場で分かる', fx:{ev:1,tr:1}, flag:'phoneInfo', result:'担当者は「退去立会いの写真があります」と言いました。会話の記録は手元に残りませんでした。', review:'電話はスピードと情報収集に強い反面、記録が残らない。', next:'s3'},
      {label:'メールで、項目ごとに根拠を尋ねる', small:'返信は遅いが、やり取りが残る', fx:{ev:1,cl:1}, flag:'record', result:'2日後、項目ごとの見積書が届きました。相手の根拠が文字で残りました。', review:'文書で尋ねると記録が残り、相手の根拠を固定できる。', next:'s3'},
      {label:'内容証明郵便で返還を求める', small:'意思の強さは伝わる。相手も身構える', fx:{cl:2,tr:-1}, flags:['record','certified'], result:'管理会社の対応は丁寧になりましたが、空気は硬くなりました。', review:'内容証明は強い意思表示。関係は硬くなり、相手の防御も固くなる。', next:'s3'}]},
    s3:{phase:'準備', title:'週末に確かめられるのは、ひとつだけ', text:`手元の資料と相手の資料。全部は確かめられません。どれを優先しますか。`, noteKey:'evidence', choices:[
      {label:'スマホの奥にある入居時の写真を探す', small:'当時の状態を直接示せるかもしれない', fx:{ev:2}, flag:'photo', result:'入居直後の壁と床の写真が見つかりました。日付データも残っています。特約は未確認のままです。', review:'入居時写真は「いつからあったか」を示す強い材料。', next:'s4'},
      {label:'契約書とクリーニング特約を読み直す', small:'ルール側を確認する', fx:{cl:2}, flag:'contract', result:'特約はありましたが金額の決め方は曖昧でした。部屋の状態の写真は手つかずです。', review:'特約の確認はクリーニング費の争いに直結する。', next:'s4'},
      {label:'管理会社に立会いメモと写真の開示を求める', small:'相手が何を持っているかを知る', fx:{ev:1,cl:1}, flag:'opponentPhoto', result:'送られてきた立会い写真には、撮影日時がはっきりしないものが混じっていました。', review:'相手の資料は、その弱点が見える場所でもある。', next:'s4'}]},
    s4:{phase:'ルールを調べる', title:'原状回復の考え方を押さえる', text:`「経年変化は借主負担にならないらしい」――自分のケースへの当てはめは、まだ曖昧です。`, noteKey:'rule', choices:[
      {label:'自治体の無料法律相談で相談する', small:'自分のケースへの当てはめを聞ける', fx:{cl:2}, flag:'guideline', result:'「経年変化」「負担の範囲」「証拠」の3点で頭が整理されました。', review:'専門家への相談は当てはめと見通しが得られる。', next:'s5'},
      {label:'ガイドラインを自分で精読しメモを作る', small:'根拠を自分の言葉で掴める', fx:{cl:1,ev:1}, flag:'guideline', result:'項目ごとのメモを作りました。当てはめの不安は少し残ります。', review:'自分で読むと理解は深まる。当てはめの確かさは相談に劣る。', next:'s5'},
      {label:'消費生活センターに相談する', small:'交渉の進め方も聞ける', fx:{cl:1,tr:1}, result:'ルールに加えて、交渉の進め方の助言ももらえました。', review:'消費生活センターは交渉の実務に強い。', next:'s5'}]},
    s5:{phase:'交渉', title:'こちらの要求を、どう置くか', text:`管理会社は「規定通りの精算です」の一点張り。要求の置き方で、その後が変わります。`, noteKey:'negotiation', choices:[
      {label:'預けた16万円、全額の返還を求める', small:'原則からの主張。譲歩の余地も残る', fx:{cl:1}, flag:'demandFull', result:'相手の反応は硬いままでしたが、譲歩の余地は手元に残りました。', review:'全額請求はアンカーを高く置く方法。根拠の強さが伴うかが鍵。', next:'s6'},
      {label:'クリーニング費の一部は認め、残りの返還を求める', small:'落としどころを示す', fx:{cl:1,tr:1}, flag:'demandPartial', result:'相手の態度が少し柔らかくなりました。「認めた部分」は戻らない前提で話が進みます。', review:'一部を認めると話は進む。認めた部分は原則戻らない。', next:'s6'},
      {label:'金額は言わず、精算の再査定を求める', small:'相手の根拠を先に出させる', fx:{ev:1}, flag:'reaudit', result:'再査定で、壁紙の面積計算に小さな重複が見つかりました。', review:'根拠を開示させる進め方は情報で得をする。決着は遅くなる。', next:'s6'}]},
    s6:{phase:'交渉', title:'相手からの提案', text:`数日後、管理会社から連絡がありました。`, doc:`「特別に、敷金から70,000円をお返しすることで終わりにしませんか」`, choices:[
      {label:'70,000円で和解する', fx:{}, ending:'settle70', review:'早期和解は確実さと引き換えに金額を置いていく選択。'},
      {label:'120,000円なら和解すると逆提案する', fx:{}, result:'相手は社内で持ち帰りました。', review:'逆提案は、準備した根拠があるほど通りやすくなる。', next:'s6b'},
      {label:'見積の根拠資料を全部出してから判断すると返す', fx:{ev:1}, flag:'opponentPhoto', result:'出てきた立会い写真には、撮影日時が曖昧なものがありました。', review:'判断を保留して資料を出させると、裁判の材料も増える。', next:'s8'}]},
    s6b:{phase:'交渉', title:'逆提案の結果', doc:`「90,000円までなら出せます。これが最終です。」`, text:`管理会社から返答がありました。`, choices:[
      {label:'90,000円で和解する', fx:{}, ending:'settle90', review:'逆提案で提示を20,000円動かした和解。'},
      {label:'断って、裁判を考える', fx:{}, review:'和解の確実さを手放し、判決に賭ける選択。', next:'s8'}]},
    s8:{phase:'次の手続', title:'話し合いがまとまらないなら', text:`請求額は160,000円。次の手続にも選択肢があります。`, noteKey:'procedure', choices:[
      {label:'少額訴訟を選ぶ', small:'60万円以下、原則1回で終わる手続', fx:{cl:1}, flag:'small', result:'争点と証拠をコンパクトにまとめることが求られました。', review:'少額訴訟は速さが魅力。相手の希望で通常訴訟に移ることもある。', next:'s9'},
      {label:'通常訴訟を選ぶ', small:'時間はかかるが、じっくり争える', fx:{ev:1}, flag:'normal', result:'期日までの間に、追加資料を集める時間も生まれました。', review:'通常訴訟は証拠を積める。負担も増える。', next:'s9'},
      {label:'民事調停を申し立てる', small:'裁判所で話し合いの場を作ってもらう', fx:{tr:1,cl:1}, flag:'mediation', result:'言い分は整理されましたが合意には届かず、整理された争点が残りました。', review:'調停は合意がなければ決着しない。争点整理の副産物がある。', next:'s9'}]},
    s9:{phase:'書類作り', title:'裁判所へ出す資料の形', text:`提出期限が近づいてきました。資料の量そのものは、意外と武器になりません。`, noteKey:'proof', choices:[
      {label:'写真を時系列で並べ、変化を中心に構成する', fx:{ev:2}, flag:'photoSet', result:'入居時と退去時が並び、変化の有無が一目で分かる形になりました。', review:'写真セットは状態の争いに強い。', next:'s10'},

      {label:'調停的な話し合いの場を持つ', fx:{tr:1,cl:1}, result:'話し合いでは金額が折り合いませんでした。争点は整理されました。', review:'話し合いは合意が前提。条項の争いは判断の場の役割。', next:'s9'}]},
    s9:{phase:'証拠', title:'審理に出す中心資料', text:`開示の有無と、発生時期をどう示すか。`, noteKey:'proof', choices:[
      {label:'データルームの目次・ログと、債務資料の不在を対応させて出す', fx:{ev:2,cl:1}, result:'「出ていなかったこと」が、記録の形で示せるようになりました。', review:'不在の立証は、目次とログという全体の記録でやる。', next:'s10'},
      {label:'債務の発生時期の資料を中心に出す', fx:{ev:2}, result:'クロージング前の債務であることは示せましたが、開示の話は別で支える必要があります。', review:'時期と開示は別の立証。役割を分ける。', next:'s10'},
      {label:'DD報告書と専門家の関与を中心に出す', fx:{cl:1,ev:1}, result:'調査の範囲は示せましたが、開示の有無そのものには届きません。', review:'DDの資料は知識の話の材料。開示はログが中心。', next:'s10'}]},
    s10:{phase:'相手の主張', title:'「データルームに資料はあった」', text:`売主側は主張しました。「DDのデータルームに取引資料一式は入っていた。見落としたのは買主側の問題だ」。反論の軸を選びます。`, choices:[
      {label:'目次とログに該当資料がなく、開示スケジュールにも記載がないと反論する', fx:{cl:2,ev:1}, result:'開示の記録の空白が、争いの中心になりました。', review:'開示の反論は、全体の記録で空白を示すのが正面。', next:'s11'},
      {label:'ファイル名や置き場所から、債務を読み取ることはできなかったと反論する', fx:{cl:1,ev:1}, result:'開示の「分かる形だったか」が争われました。', review:'開示は、存在だけでなく認識可能性も問題になる。', next:'s11'},
      {label:'表明保証はリスク配分の約束であり、調査の範囲とは別だと反論する', fx:{cl:2}, result:'保証の趣旨そのものが争点になりました。', review:'リスク配分の趣旨は、知っていたかの例外の読み方に効く。', next:'s11'}]},
    s11:{phase:'判断者からの質問', title:'「買主は、どこまで調べればよかったのですか？」', text:`期日。DDと保証の関係を問う質問です。`, noteKey:'credibility', choices:[
      {label:'通常のDDの範囲と、専門家を起用した経緯を示して答える', fx:{tr:2}, result:'調査の実態と答えが一致し、頷きが返ってきました。', review:'調べの答えは、範囲と体制を具体的に示すことが強い。', next:'s12'},
      {label:'「保証があるのだから、調べる必要はありませんでした」と答える', fx:{tr:-1}, result:'「それでも通常の調査はされたのですか」と重ねて聞かれました。', review:'保証を調査の免罪符にする答えは、条項の読みを問われる。', next:'s12'},
      {label:'調べの弱かった部分は認め、保証でリスクを配分した趣旨だと限定して答える', fx:{tr:1,cl:1}, result:'認める部分と趣旨の主張が分かれ、話が具体的になりました。', review:'限定して認める答えは、趣旨の主張の信用を高める。', next:'s12'}]},
    s12:{phase:'和解の提示', title:'判断か、和解か', preNoteKey:'negotiation', text:`「1,100万円の補償でまとめる案を考えています」という提示がありました。`, choices:[
      {label:'案を受け入れる（1,100万円）', fx:{}, ending:'judgeSettle', review:'確実な決着。残りの債務は自社で処理する形。'},
      {label:'受け入れず、判断をもらう', fx:{}, ending:'verdict', review:'判断では開示と条項の評価がそのまま金額になる。'}]}
  }
});
/*__CASES__*/
/* ============ エンジン ============ */
const PROG_KEY='court-app-v1-results', SAVE_KEY='court-app-v1-save';
const yen=n=>n.toLocaleString('ja-JP')+'円';
const ORDER=['intro','s2','s3','s4','s5','s6','s6b','s8','s9','s10','s11','s12'];
let cur=null, sceneId=null, ps=null, pendingResult='', filterCat='すべて';
const $app=document.getElementById('app'), $top=document.getElementById('topbar');
function results(){ try{return JSON.parse(localStorage.getItem(PROG_KEY))||{}}catch(e){return{}} }
function saveResults(r){ localStorage.setItem(PROG_KEY, JSON.stringify(r)); }
function getNote(k){ if(!k) return null; return (cur && cur.notes && cur.notes[k]) || NOTES[k] || null; }
function freshPs(){ return {ev:0,cl:0,tr:0,flags:{},log:[]}; }

function renderHome(){
  cur=null; sceneId=null;
  const r=results(); const done=Object.keys(r).length;
  $top.innerHTML=`<div style="font-size:13px;font-weight:700;color:var(--navy)">判決・和解まで到達した事件 ${done} / ${CASES.length}</div><div class="bar"><i style="width:${CASES.length?Math.round(done/CASES.length*100):0}%"></i></div><div class="hintline">自分用アプリ版 ― 事件を選んで遊べます。途中で閉じても、事件ごとに続きから再開できます。</div>`;
  const cats=['すべて',...new Set(CASES.map(c=>c.cat))];
  const list=CASES.filter(c=>filterCat==='すべて'||c.cat===filterCat);
  $app.innerHTML=`
    <div class="filters">${cats.map(c=>`<button class="fbtn ${c===filterCat?'on':''}" data-cat="${c}">${c}</button>`).join('')}</div>
    ${list.map(c=>{ const d=r[c.id]; return `<div class="casecard" data-id="${c.id}">
      <div class="cc-top"><div class="cc-icon">${c.icon}</div>
      <div><div class="cc-title">${c.title}</div><div class="cc-meta">${c.cat} ／ ${c.claimLabel} ／ ${c.time}</div></div>
      <div class="cc-status">${d?('✔ 到達<br>'+yen(d.amount)):''}</div></div>
      <div class="cc-desc">${c.desc}</div>
      ${d?`<div class="cc-meta">前回の結末：${d.ending}（${d.plays}回プレイ）</div>`:'<div class="cc-meta">未プレイ</div>'}
    </div>`}).join('')}
    <div class="toolbar"><button id="resetAll">クリア記録と保存を全部リセット</button></div>`;
  $app.querySelectorAll('.fbtn').forEach(b=>b.addEventListener('click',()=>{filterCat=b.dataset.cat; renderHome();}));
  $app.querySelectorAll('.casecard').forEach(el=>el.addEventListener('click',()=>startCase(el.dataset.id)));
  document.getElementById('resetAll').addEventListener('click',()=>{ if(confirm('記録を全部消しますか？')){ localStorage.removeItem(PROG_KEY); localStorage.removeItem(SAVE_KEY); renderHome(); }});
}

function startCase(id){
  cur=CASES.find(c=>c.id===id); ps=freshPs(); sceneId='intro'; pendingResult='';
  try{ const sv=JSON.parse(localStorage.getItem(SAVE_KEY)); if(sv && sv.caseId===id && sv.sceneId && cur.scenes[sv.sceneId] && sv.ps){ ps=sv.ps; sceneId=sv.sceneId; } }catch(e){}
  renderScene();
}
function savePlay(){ localStorage.setItem(SAVE_KEY, JSON.stringify({caseId:cur.id, sceneId, ps})); }
function topForCase(){
  const idx=Math.max(0, ORDER.indexOf(sceneId));
  $top.innerHTML=`<div style="font-size:13px;font-weight:700;color:var(--navy)">${cur.icon} ${cur.title} ― ${cur.claimLabel}</div><div class="bar"><i style="width:${Math.round(((idx+1)/ORDER.length)*100)}%"></i></div><div class="hintline">選択の数字は表示されません。結果は最後の振り返りで分かります。</div>`;
}
function applyChoiceFx(c){
  let fx=c.fx||{};
  if(c.fxFn && FXFN[c.fxFn]) fx=FXFN[c.fxFn](ps);
  ps.ev+=(fx.ev||0); ps.cl+=(fx.cl||0); ps.tr+=(fx.tr||0);
  if(c.flag) ps.flags[c.flag]=true;
  if(c.flags) c.flags.forEach(f=>ps.flags[f]=true);
}
function renderScene(){
  topForCase();
  const s=cur.scenes[sceneId];
  const pre=getNote(s.preNoteKey);
  $app.innerHTML=`<section class="card">
    ${pendingResult?`<div class="result">${pendingResult}</div>`:''}
    <div class="phase">${s.phase||''}</div><div class="scene-title">${s.title||''}</div>
    ${s.text?`<div class="text">${s.text}</div>`:''}
    ${s.doc?`<div class="doc">${s.doc}</div>`:''}
    ${pre?`<div class="notebox"><div class="ntitle">${pre.title}</div><div class="nbody">${pre.body}</div></div>`:''}
    <div class="choices">${s.choices.map((c,i)=>`<button class="choice" data-i="${i}">${c.label}${c.small?`<small>${c.small}</small>`:''}</button>`).join('')}</div>
    <div class="note">どの選択にも、得るものと置いていくものがあります。</div>
  </section>
  <div class="toolbar"><button id="toHome">事件一覧へ戻る（進行は保存されます）</button><button id="restartCase">この事件を最初から</button></div>`;
  pendingResult='';
  document.getElementById('toHome').addEventListener('click',()=>{ savePlay(); renderHome(); });
  document.getElementById('restartCase').addEventListener('click',()=>{ ps=freshPs(); sceneId='intro'; localStorage.removeItem(SAVE_KEY); renderScene(); });
  $app.querySelectorAll('button.choice').forEach(btn=>btn.addEventListener('click',()=>{
    const c=s.choices[Number(btn.dataset.i)];
    applyChoiceFx(c);
    ps.log.push({scene:s.title||'', choice:c.label, review:c.review||''});
    const go=()=>{ if(c.ending){ renderEnding(c.ending); } else { sceneId=c.next; savePlay(); renderScene(); window.scrollTo({top:0,behavior:'smooth'}); } };
    const note=getNote(s.noteKey);
    if(note && !c.ending) showNote(note, c.result||'', go);
    else { pendingResult=c.result||''; go(); }
  }));
}
function showNote(note, result, go){
  $top.innerHTML=`<div style="font-size:13px;font-weight:700;color:var(--navy)">${cur.icon} ${cur.title}</div>`;
  $app.innerHTML=`<section class="card">
    ${result?`<div class="result">${result}</div>`:''}
    <div class="notebox" style="margin-top:0"><div class="ntitle">${note.title}</div><div class="nbody">${note.body}</div></div>
    <div class="choices"><button class="choice" id="cont">次へ進む</button></div></section>`;
  window.scrollTo({top:0,behavior:'smooth'});
  document.getElementById('cont').addEventListener('click', go);
}
function statVal(key){ if(key==='ev')return ps.ev; if(key==='cl')return ps.cl; if(key==='tr')return ps.tr; if(key==='evcl')return ps.ev+ps.cl; if(key==='evtr')return ps.ev+ps.tr; if(key==='cltr')return ps.cl+ps.tr; return 0; }
function tierOf(item){
  if(item.flagGood && ps.flags[item.flagGood]) return 0;
  if(item.flagMid && ps.flags[item.flagMid]) return 1;
  if(item.flagGood || item.flagMid) { /* fallthrough to stat if flags set but unmatched */ }
  const v=statVal(item.stat||'cl'); return v>=(item.hi??6)?0:(v>=(item.lo??4)?1:2);
}
function verdictCalc(){
  const v=cur.verdict; let rows=[], total=0;
  v.items.forEach(it=>{ const t=tierOf(it); const amt=it.amounts[t]; rows.push({label:it.label, claimed:it.claimed, amt, why:it.why}); total+=amt; });
  const amount = v.mode==='deduction' ? Math.max(0,(v.base||0)-total) : total;
  return {rows, total, amount};
}
function qual(v,a,b){ return v>=a?'手厚く積めた':(v>=b?'一定の厚みはある':'薄さが残った'); }
function debrief(){
  const rows=ps.log.filter(l=>l.review).map(l=>`<div class="review"><b>${l.scene}</b> ― ${l.choice}<div class="rv">${l.review}</div></div>`).join('');
  return `<div class="qual"><span class="qchip">証拠の積み方：${qual(ps.ev,7,4)}</span><span class="qchip">主張の組み立て：${qual(ps.cl,7,4)}</span><span class="qchip">心証の形成：${qual(ps.tr,3,1)}</span></div>
  <div class="scene-title" style="font-size:19px;margin-top:18px">あなたの選択の振り返り</div>${rows}
  <div class="scene-title" style="font-size:19px;margin-top:20px">持ち帰れる知識</div>
  <ul class="know">${cur.knowledge.map(k=>`<li>${k}</li>`).join('')}</ul>
  <div class="choices"><button class="choice" id="again">この事件をもう一度遊ぶ</button><button class="choice" id="home2">事件一覧へ戻る</button></div>`;
}
function finishRecord(amount, endingTitle){
  const r=results(); const prev=r[cur.id];
  r[cur.id]={amount, ending:endingTitle, plays:(prev?prev.plays:0)+1};
  saveResults(r); localStorage.removeItem(SAVE_KEY);
}
function bindEndButtons(){ const a=document.getElementById('again'); if(a) a.addEventListener('click',()=>{ ps=freshPs(); sceneId='intro'; renderScene(); }); const h=document.getElementById('home2'); if(h) h.addEventListener('click', renderHome); }
function renderEnding(kind){
  $top.innerHTML=`<div style="font-size:13px;font-weight:700;color:var(--navy)">${cur.icon} ${cur.title} ― 結末</div><div class="bar"><i style="width:100%"></i></div>`;
  if(kind==='verdict'){
    const v=verdictCalc(); const isDed=cur.verdict.mode==='deduction'; const isPay=cur.verdict.mode==='payment';
    finishRecord(v.amount,'判決 '+yen(v.amount));
    $app.innerHTML=`<section class="card">
      <div class="phase">判決</div><div class="scene-title">主文</div>
      <div class="verdict"><span class="tag">主文</span>${isDed?'被告は原告に対し、次の金額を支払え。':(isPay?'原告（業者）の請求について、被告であるあなたは次の金額を支払え。':'原告の請求について、次の金額の支払いを命じる。')}<div class="amount">${yen(v.amount)}</div></div>
      <div class="scene-title" style="font-size:19px;margin-top:18px">なぜこの金額になったのか</div>
      <table><tr><th>項目</th><th>${isDed?'請求された控除':'請求額'}</th><th>${isDed?'認められた控除':'認められた額'}</th></tr>
      ${v.rows.map(r=>`<tr><td>${r.label}</td><td>${yen(r.claimed)}</td><td>${yen(r.amt)}</td></tr>`).join('')}
      ${isDed?`<tr><td><b>控除 合計</b></td><td></td><td><b>${yen(v.total)}</b></td></tr>`:''}${isPay?`<tr><td><b>支払額 合計</b></td><td></td><td><b>${yen(v.total)}</b></td></tr>`:''}</table>
      ${v.rows.map(r=>`<div class="text" style="font-size:14px">・${r.label}：${r.why}</div>`).join('')}
      ${debrief()}</section>`;
  } else {
    const e=cur.endings[kind]; finishRecord(e.amount, e.title);
    $app.innerHTML=`<section class="card">
      <div class="phase">終了</div><div class="scene-title">エンディング ― ${e.title}</div>
      <div class="amount">${yen(e.amount)}</div><div class="text">${e.body}</div>
      ${debrief()}</section>`;
  }
  bindEndButtons(); window.scrollTo({top:0,behavior:'smooth'});
}
renderHome();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
